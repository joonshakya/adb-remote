name: AdbRemote
options:
  bundleIdPrefix: local.adbremote
  deploymentTarget:
    iOS: "17.0"
packages:
  AdbKit:
    path: ../AdbKit
targets:
  AdbRemote:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Assets.xcassets
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: AdbKit
      - target: SendToTV
    entitlements:
      path: Sources/AdbRemote.entitlements
      properties:
        com.apple.security.application-groups: [group.local.adbremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.adbremote.app
        MARKETING_VERSION: "0.10"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ADB Remote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to Android devices on your network over ADB."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Shows your photos and videos on the TV."
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sources/Info.plist
      properties:
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleURLName: local.adbremote.send
            CFBundleURLSchemes: [adbremote]
        LSSupportsOpeningDocumentsInPlace: true
        NSBonjourServices:
          - _adb-tls-pairing._tcp
          - _adb-tls-connect._tcp
          - _adb._tcp
  SendToTV:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    dependencies:
      - package: AdbKit
    entitlements:
      path: ShareExtension/SendToTV.entitlements
      properties:
        com.apple.security.application-groups: [group.local.adbremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.adbremote.app.sendtotv
        MARKETING_VERSION: "0.10"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Send to TV
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to Android devices on your network over ADB."
        CODE_SIGN_STYLE: Automatic
    info:
      path: ShareExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  AdbRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AdbRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.adbremote.uitests
schemes:
  AdbRemote:
    build:
      targets:
        AdbRemote: all
        AdbRemoteUITests: [test]
    test:
      targets: [AdbRemoteUITests]
